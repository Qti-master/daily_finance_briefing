name: Daily Finance Briefing

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-finance-briefing
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  write-report:
    name: Write HTML report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          mkdir -p .codex
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          } 2>&1 | tee .codex/install-dependencies.log

      - name: Generate HTML report
        run: |
          mkdir -p .codex
          set -euo pipefail
          python scripts/daily_finance_briefing.py --output-dir reports 2>&1 | tee .codex/generate-report.log

      - name: Commit report
        run: |
          mkdir -p .codex
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            git add reports/*.html
            if git diff --cached --quiet; then
              echo "No report changes to commit."
            else
              REPORT_DATE="$(date +%F)"
              git commit -m "chore: add daily finance briefing ${REPORT_DATE}"
              git push
            fi
          } 2>&1 | tee .codex/commit-report.log

      - name: Create Codex failure handoff issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .codex

          {
            echo "# Codex handoff: Daily Finance Briefing failed"
            echo
            echo "GitHub Actions failed while generating the daily finance briefing."
            echo
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Captured Error Logs"
            echo

            if compgen -G ".codex/*.log" > /dev/null; then
              for log_file in .codex/*.log; do
                echo "### ${log_file}"
                echo
                echo '```text'
                tail -n 160 "$log_file"
                echo '```'
                echo
              done
            else
              echo "No command logs were captured. Check the run URL above for setup or checkout failures."
            fi
            echo
            echo "Codex: inspect this failure and update the workflow or briefing script as needed."
          } > .codex/codex-failure-issue.md

          gh label create codex --color 0E8A16 --description "Needs Codex attention" --force || true
          gh label create github-actions --color 1D76DB --description "GitHub Actions workflow" --force || true
          gh label create failure --color D73A4A --description "Failed automation" --force || true

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex: Daily Finance Briefing failed on $(date +%F)" \
            --body-file .codex/codex-failure-issue.md \
            --label codex \
            --label github-actions \
            --label failure

      - name: Upload Codex failure handoff artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-failure-handoff
          path: .codex/
          retention-days: 14
